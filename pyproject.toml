[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "dmarket-client"
dynamic = ["version"]
description = "Typed synchronous and asynchronous client for the DMarket Trading API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.12,<3",
  "PyNaCl>=1.6.2,<2",
  "simplejson>=3.20,<4",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
  "types-simplejson>=3.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dmarket_client"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.dmarket-release]
initial-version = "0.1.0"

[project.urls]
Source = "https://github.com/ykirshov/dmarket-client"
Issues = "https://github.com/ykirshov/dmarket-client/issues"
Documentation = "https://github.com/ykirshov/dmarket-client#readme"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "contracts", "examples", "docs", ".github", ".gitignore", "pyproject.toml", "uv.lock", "README.md", "CHANGELOG.md", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/dmarket_client"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

