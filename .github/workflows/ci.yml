name: CI
on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.14
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/dmarket_client
      - run: uv run python tools/check_generated.py
      - run: uv run pytest -q
      - run: uv build
